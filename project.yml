name: FitTrack
options:
  bundleIdPrefix: com.fittrack
  createIntermediateGroups: true
packages:
  Supabase:
    url: https://github.com/supabase-community/supabase-swift.git
    from: 2.14.0
targets:
  FitTrack:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Configuration
      - path: Core
      - path: Models
      - path: Services
      - path: ViewModels
      - path: Views
    dependencies:
      - package: Supabase
        product: Supabase
    info:
      path: Configuration/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fittrack.FitTrack
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: "1.0.0"

  FitTrackTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/FitTrackTests
    dependencies:
      - target: FitTrack
    settings:
      base:
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO

schemes:
  FitTrack:
    build:
      targets:
        FitTrack: all
    test:
      targets:
        - FitTrackTests
    run:
      config: Debug
